name: Sync upstream

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main
    runs-on: windows-latest

    steps:
      # GitHub disables a public repository's scheduled workflows after 60 days
      # without repository activity, and this sync commits nothing while
      # upstream is quiet (it was, from April to September 2026). Re-enabling
      # the workflow through the API on every run resets that clock without a
      # dummy commit.
      - name: Keep the daily schedule enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/upstream-sync.yaml/enable"

      - name: Check out fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Rebase onto upstream main
        id: rebase
        shell: bash
        env:
          TARGET_BRANCH: main
          UPSTREAM_REPOSITORY: glzr-io/glazewm
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          upstream_sha=$(git rev-parse upstream/main)
          before_sha=$(git rev-parse HEAD)

          if git merge-base --is-ancestor upstream/main HEAD; then
            {
              echo "upstream_sha=${upstream_sha}"
              echo "before_sha=${before_sha}"
              echo 'changed=false'
              echo 'conflict=false'
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git rebase upstream/main
          rebase_status=$?
          set -e

          if ((rebase_status != 0)); then
            conflicts=$(git diff --name-only --diff-filter=U | paste -sd ', ' -)
            git rebase --abort
            {
              echo "upstream_sha=${upstream_sha}"
              echo "before_sha=${before_sha}"
              echo 'changed=false'
              echo 'conflict=true'
              echo "conflicts=${conflicts:-unknown files}"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "upstream_sha=${upstream_sha}"
            echo "before_sha=${before_sha}"
            echo 'changed=true'
            echo 'conflict=false'
          } >>"$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.rebase.outputs.changed == 'true' && steps.rebase.outputs.conflict != 'true'
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
          toolchain: stable

      - name: Restore Rust cache
        if: steps.rebase.outputs.changed == 'true' && steps.rebase.outputs.conflict != 'true'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: upstream-sync-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}

      - name: Validate rebased fork
        id: validation
        if: steps.rebase.outputs.changed == 'true' && steps.rebase.outputs.conflict != 'true'
        continue-on-error: true
        shell: bash
        env:
          VERSION_NUMBER: 0.0.0-upstream-sync
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --locked -p wm --bin glazewm --target x86_64-pc-windows-msvc

      - name: Publish rebased fork
        id: publish
        if: steps.rebase.outputs.changed == 'true' && steps.rebase.outputs.conflict != 'true' && steps.validation.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TARGET_BRANCH: main
          BEFORE_SHA: ${{ steps.rebase.outputs.before_sha }}
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${BEFORE_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Notify when automatic sync is blocked
        if: always() && steps.rebase.outcome == 'success' && (steps.rebase.outputs.conflict == 'true' || steps.validation.outcome == 'failure' || steps.publish.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '[upstream-sync] main is blocked'
          TARGET_BRANCH: main
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.rebase.outputs.conflict }}' == 'true' ]]; then
            reason="Rebase conflict in: ${CONFLICTS:-unknown files}"
          elif [[ '${{ steps.validation.outcome }}' == 'failure' ]]; then
            reason='The upstream rebase was clean, but Windows validation failed.'
          else
            reason='The upstream rebase and validation succeeded, but the lease-protected branch push was rejected.'
          fi

          body="Automatic upstream synchronization for \`${TARGET_BRANCH}\` is blocked.

          ${reason}

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
          exit 1

      - name: Resolve prior sync notification
        if: always() && steps.rebase.outcome == 'success' && steps.rebase.outputs.conflict != 'true' && (steps.rebase.outputs.changed != 'true' || (steps.validation.outcome == 'success' && steps.publish.outcome == 'success'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '[upstream-sync] main is blocked'
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --comment 'Automatic upstream synchronization is healthy again.'
          fi
