name: PR title check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: glzr-io/actions/semantic-prs@10ebe8fb1e5e424a13855b7e3fd6a49c48e06314 # main, 2024-12-12
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
