name: Lint check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
          toolchain: stable

      - uses: swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      # Clippy itself runs `cargo check`, so this will also check for compilation errors.
      - name: Check linting (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings
