name: Dependency audit

# Checks Cargo.lock against the RustSec advisory database. Dependabot here only
# watches the workflow action pins, and GitHub's dependency alerts are off, so
# without this nothing reports a locked crate with a published vulnerability:
# the dotfiles setup installs this lock as-is (`cargo build --locked`, and the
# setup prebuilt). Weekly as well as on lock changes, because new advisories land
# against an unchanged lock. Vulnerabilities fail the run; unmaintained and
# unsound notices are printed as warnings.

on:
  push:
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - .github/workflows/audit.yaml
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit
